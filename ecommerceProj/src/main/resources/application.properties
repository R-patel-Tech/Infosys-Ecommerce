spring.application.name=ecommerceProj
server.port=8080
spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Keep startup simple for local development.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.brand-name=Raj_ecommerce
razorpay.description=Order payment
razorpay.logo-url=
